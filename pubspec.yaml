name: anilov
description: "Discover anime. Track every episode."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ">=2.5.1 <4.0.0"
  go_router: ">=14.0.0 <19.0.0"
  shared_preferences: ">=2.2.0 <3.0.0"
  dio: ">=5.4.0 <6.0.0"
  cached_network_image: ">=3.3.0 <5.0.0"
  sqflite: ">=2.3.0 <3.0.0"
  path: ">=1.9.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_launcher_icons: ">=0.13.1 <1.0.0"
  flutter_native_splash: ">=2.4.0 <3.0.0"
  mocktail: ">=1.0.0 <2.0.0"
  sqflite_common_ffi: ">=2.3.0 <3.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1B1464"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#1B1464"
  image: "assets/icon/icon_foreground.png"
  android_12:
    color: "#1B1464"
    image: "assets/icon/icon_foreground.png"
