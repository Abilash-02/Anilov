name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Anilov APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 2. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Create android directory if missing
        run: |
          if [ ! -d "android" ]; then
            echo "android/ directory is missing; generating android folder..."
            mkdir -p /tmp/anilov_init
            flutter create --platforms=android --org com.anilov --project-name anilov /tmp/anilov_init
            cp -r /tmp/anilov_init/android ./android
            rm -rf /tmp/anilov_init
          fi

      - name: 4. Install Pillow and generate icons
        run: |
          python3 -m pip install pillow
          python3 tools/make_icon.py

      - name: 5. Patch Android configuration
        run: |
          python3 tools/patch_android.py

      - name: 6. Flutter pub get
        run: |
          flutter pub get

      - name: 7. Generate launcher icons and native splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: 8. Format code
        run: |
          dart format .

      - name: 9. Analyze code
        run: |
          flutter analyze .

      - name: 10. Run tests
        run: |
          flutter test .

      - name: 11. Build debug APK
        run: |
          flutter build apk --debug

      - name: 12. Report APK size and upload artifact
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK built successfully:"
            ls -lh "$APK_PATH"
          else
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anilov-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
